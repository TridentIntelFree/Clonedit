name: CI

# The point of this workflow is that the checks stop being something someone
# remembers to run. Everything here was previously a script in a temp directory
# on one machine, which is the same as not having it.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # playwright-core ships no browser of its own. Cached by version so this
      # is a download once, not once per run.
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # playwright-core's own CLI, so the browser always matches the version in
      # package-lock.json rather than whatever `playwright@latest` resolves to.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      # "I've been stuck on version 267 for several sessions" — nothing was
      # stuck. The hand-written BUILD line in src/legacy.js had not moved
      # for seven commits, so the app kept introducing itself as R267
      # while everything under it changed. It cannot be injected at build
      # time: index.html is committed and the drift check below demands a
      # byte-identical rebuild, while a build runs before the commit it
      # ships with, so anything taken from git history differs between
      # the two. Here HEAD *is* the shipping commit, so the arithmetic is
      # exact and this is the one place the check belongs.
      - name: The version the app shows is the version it is
        run: node scripts/check-build-label.mjs

      - name: Unit tests
        run: npm test

      # Builds index.html and holds the build if the staged page will not boot.
      - name: Build
        run: npm run build

      # index.html is committed, so a build that changes it without the change
      # being committed means the published file and the source have drifted.
      - name: index.html is up to date with src/
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html differs from what src/ builds. Run 'npm run build' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Browser tests
        run: npm run test:browser

      - name: Upload the built page when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: built-page
          path: |
            index.html
            index.next.html
          if-no-files-found: ignore
          retention-days: 7
