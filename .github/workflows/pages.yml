# PUT THE CURRENT BUILD ON A URL. RUN IT WHEN YOU WANT IT PUBLISHED.
#
# Manual on purpose. index.html is committed and CI already fails when it has
# drifted from src/, so publishing is a separate decision from pushing, made
# when there is something worth looking at -- not on every commit.
#
# Run it from the Actions tab (Pages > Run workflow), or with the GitHub API.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Only what the running app asks for. The repository also holds src/,
      # tests/, songs/ and 70KB of notes, and a working tree can hold hundreds
      # of megabytes of bounced WAVs -- gitignored, so a fresh checkout has
      # none, and naming the files keeps it that way if that ever changes.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.png _site/
          cp -r icons samples _site/
          # Pages runs Jekyll unless told not to, and Jekyll drops files whose
          # names start with an underscore or a dot.
          touch _site/.nojekyll
          echo "staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Check the shell is complete
        run: |
          fail=0
          for f in index.html manifest.webmanifest sw.js icons/icon-192.png; do
            [ -s "_site/$f" ] || { echo "::error::_site/$f is missing or empty"; fail=1; }
          done
          grep -q 'JBH-88' _site/index.html || { echo "::error::index.html does not look like the app"; fail=1; }
          [ "$(find _site/samples -name '*.json' | wc -l)" -gt 0 ] || { echo "::error::no sample manifests"; fail=1; }
          exit $fail

      # enablement turns Pages on and points it at this workflow, so the first
      # run configures the site instead of failing with "Pages is not enabled".
      # If the token may not do that, this is where it fails, and the fix is
      # one switch: Settings > Pages > Source = GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Say where it went
        run: |
          echo "### Live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<${{ steps.deployment.outputs.page_url }}>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "from \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
